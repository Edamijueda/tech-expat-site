server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # needed for kbr user lockout audit log

spring:
  datasource:
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.techexpat: INFO
