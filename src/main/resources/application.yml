spring:
  application:
    name: TechExpat Site
  servlet:
    multipart:
      max-file-size: 9MB # just above receipts.max-bytes so our own message handles the 8 MB case
      max-request-size: 10MB

info:
  app:
    name: TechExpat Site
    description: Agency portfolio and client portal
    version: 1.0.0

management:
  info:
    env:
      enabled: true

posthog:
  key: ${POSTHOG_KEY:}

nowpayments:
  api-key: ${NOWPAYMENTS_API_KEY:}
  ipn-secret: ${NOWPAYMENTS_IPN_SECRET:}
  base-url: ${NOWPAYMENTS_BASE_URL:https://api.nowpayments.io/v1}
  success-url: ${NOWPAYMENTS_SUCCESS_URL:}
  cancel-url: ${NOWPAYMENTS_CANCEL_URL:}
  ipn-callback-url: ${NOWPAYMENTS_IPN_CALLBACK_URL:}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

kbr:
  remember-me-key: ${KBR_REMEMBER_ME_KEY:}

receipts:
  supabase-url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  bucket: ${TE_KBR_STORAGE_BUCKET:}
  max-bytes: 8388608 # 8 MB: a 12 MP phone photo often lands at 2-5 MB, so 5 MB was tight

display:
  # Never the server's zone: Railway runs UTC, which would show dates a day early after midnight.
  zone: ${DISPLAY_ZONE:Africa/Lagos}
