spring:
  application:
    name: TechExpat Site

info:
  app:
    name: TechExpat Site
    description: Agency portfolio and client portal
    version: 1.0.0

management:
  info:
    env:
      enabled: true

posthog:
  key: ${POSTHOG_KEY:}

nowpayments:
  api-key: ${NOWPAYMENTS_API_KEY:}
  ipn-secret: ${NOWPAYMENTS_IPN_SECRET:}
  base-url: ${NOWPAYMENTS_BASE_URL:https://api.nowpayments.io/v1}
  success-url: ${NOWPAYMENTS_SUCCESS_URL:}
  cancel-url: ${NOWPAYMENTS_CANCEL_URL:}
  ipn-callback-url: ${NOWPAYMENTS_IPN_CALLBACK_URL:}

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
