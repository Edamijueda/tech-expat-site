spring:
  config:
    import: optional:file:./.env[.properties]
  output:
    ansi:
      enabled: always
  mvc:
    log-request-details: true
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java, src/main/resources
    livereload:
      enabled: true
management:
  info:
    os:
      enabled: true
    java:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env, beans, mappings, loggers, httpexchanges
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%clr(%-5level) %clr([%t]){faint} %clr(%logger{36}){cyan} : %msg%n"
    # console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%-5level) %clr([%t]){faint} %clr(%logger{36}){cyan} : %msg%n"  # with timestamp
  level:
    com.techexpat: DEBUG
    web: DEBUG
