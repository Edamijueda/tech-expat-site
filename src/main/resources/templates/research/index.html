<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      lang="en">
<head>
    <title>Research</title>
    <style>
        .research-link { transition: color .15s ease-in-out; }
        .research-link:hover,
        .research-link:focus { color: #0d6efd !important; text-decoration: underline !important; }
    </style>
</head>
<body>

<div layout:fragment="notice"></div>

<main layout:fragment="content">

    <div class="d-flex justify-content-end p-3">
        <a th:href="@{/}" class="btn btn-outline-dark fw-bold">Back to Home</a>
    </div>

    <section class="flex-grow-1 d-flex justify-content-center align-items-start py-5">
        <div class="px-4 px-lg-5" style="width: 100%; max-width: 720px;">

            <h1 class="fw-semibold fs-2 mb-4">Research</h1>

            <ol class="list-group list-group-numbered list-group-flush fs-5">
                <li th:each="post : ${posts}" class="list-group-item border-0 ps-0 py-3">
                    <a th:href="@{/research/{slug}(slug=${post.slug})}"
                       class="research-link text-dark fw-semibold text-decoration-none"
                       th:text="${post.title}">Post title</a>
                </li>
            </ol>

        </div>
    </section>

</main>

</body>
</html>
