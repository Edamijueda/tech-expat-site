<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      lang="en">
<head>
    <title th:text="${post.title}">Post</title>
    <style>
        .post-body p { margin-bottom: 1rem; }
        .post-body h2 { font-size: 1.25rem; font-weight: 600; margin-top: 2rem; margin-bottom: .75rem; }
        .post-body ul, .post-body ol { margin-bottom: 1rem; }
        .post-body a { color: #0d6efd; }
    </style>
</head>
<body>

<div layout:fragment="notice"></div>

<main layout:fragment="content">

    <article class="flex-grow-1 d-flex justify-content-center align-items-start py-5">
        <div class="px-4 px-lg-5" style="width: 100%; max-width: 720px;">

            <h1 class="fw-semibold fs-2 mb-3" th:text="${post.title}">Post title</h1>

            <p class="text-muted small mb-4">
                <span th:text="${post.author}">Author</span>
                <span> &middot; </span>
                <span th:text="${post.formattedDate}">Date</span>
                <th:block th:if="${post.updatedDate != null}">
                    <span> &middot; </span>
                    <span th:text="'Updated ' + ${post.formattedUpdatedDate}">Updated 31 Aug, 2026</span>
                </th:block>
                <span> &middot; </span>
                <span th:text="${post.readingMinutes} + ' min read'">3 min read</span>
                <span> &middot; </span>
                <span th:text="${post.aiPercent} + '% AI'">30% AI</span>
                <span> &middot; </span>
                <span th:text="${post.humanPercent} + '% human'">70% human</span>
            </p>

            <div class="post-body" th:utext="${post.htmlBody}"></div>

            <p class="mt-5 small">
                <a th:href="@{/{section}(section=${section.slug})}"
                   class="text-muted text-decoration-none">
                    &larr; More <span th:text="${#strings.toLowerCase(section.label)}">section</span> posts
                </a>
            </p>

        </div>
    </article>

</main>

</body>
</html>
