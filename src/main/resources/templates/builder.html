<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      lang="en">
<head>
    <title>Builder</title>
    <link rel="stylesheet" th:href="@{/css/service-grid.css}">
</head>
<body>

<main layout:fragment="content">

    <!-- Toggle: View as Visionary -->
    <div class="d-flex justify-content-end p-3">
        <a th:href="@{/}" class="btn btn-outline-dark fw-bold">View as Visionary</a>
    </div>

    <!-- Service grid — centered vertically and horizontally -->
    <section class="flex-grow-1 d-flex justify-content-center align-items-center py-5">
        <div class="px-4 px-lg-5" style="width: 100%; max-width: 960px;">
            <div class="row row-cols-2 row-cols-lg-3 g-3 g-lg-4 justify-content-center">

                <div th:replace="~{fragments/service-button :: serviceButton(
                    'IT Consulting',
                    'Architecture reviews, technical audits, and engineering strategy')}"></div>

                <div th:replace="~{fragments/service-button :: serviceButton(
                    'Maintain',
                    'Collaborative code ownership, refactoring, and system reliability')}"></div>

                <div th:replace="~{fragments/service-button :: serviceButton(
                    'Build',
                    'Partner with senior engineers on ambitious technical challenges')}"></div>

                <div th:replace="~{fragments/service-button :: serviceButton(
                    'Learn',
                    'Advanced workshops, code reviews, and peer-driven skill growth')}"></div>

                <div th:replace="~{fragments/service-button :: serviceButton(
                    'Design',
                    'Technical design systems, APIs, and component architecture')}"></div>

                <div th:replace="~{fragments/service-button :: serviceButton(
                    'Security',
                    'Harden your systems with expert audits, penetration testing, and security best practices')}"></div>

            </div>
        </div>
    </section>

</main>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/service-grid.js}"></script>
</th:block>

</body>
</html>
