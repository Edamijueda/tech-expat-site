<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - TechExpat">TechExpat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <div layout:fragment="notice">
            <div class="alert alert-info alert-dismissible fade show text-center mb-0 rounded-0 py-2" role="alert">
                See our updated <a th:href="@{/course-outline}" class="alert-link">courses</a>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                        style="font-size:.7rem;padding:.85rem;"></button>
            </div>
        </div>
        <!-- <nav>
            <a th:href="@{/}">Home</a>
        </nav> -->
    </header>

    <main layout:fragment="content" class="flex-grow-1 d-flex flex-column">
        <!-- Page content goes here -->
    </main>

    <footer class="d-flex justify-content-between align-items-center px-3 py-2">
        <p class="mb-0">&copy; 2026 </p>
        <p class="mb-0">hello@tech-expat.com</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <th:block layout:fragment="scripts"></th:block>
</body>
</html>
