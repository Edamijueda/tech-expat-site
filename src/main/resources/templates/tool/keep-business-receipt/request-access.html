<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}" lang="en">

<head>
    <title>Request access</title>
    <meta name="description" content="Request access to Keep Business Receipt.">
</head>

<body>

    <div layout:fragment="notice"></div>

    <main layout:fragment="content">

        <div class="d-flex justify-content-end p-3">
            <a th:href="@{/tool/keep-business-receipt}" class="btn btn-outline-dark fw-bold">Back</a>
        </div>

        <section class="flex-grow-1 d-flex justify-content-center align-items-start py-4">
            <div class="px-4" style="width: 100%; max-width: 480px;">

                <h1 class="fw-semibold fs-3 mb-3">Request access</h1>

                <div th:if="${errors}" class="alert alert-danger" role="alert">
                    <ul class="mb-0 ps-3">
                        <li th:each="e : ${errors}" th:text="${e}"></li>
                    </ul>
                </div>

                <form th:action="@{/tool/keep-business-receipt/request-access}" method="post"
                    th:object="${form}" novalidate>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                            required autocomplete="email" maxlength="255">
                    </div>

                    <div class="mb-3">
                        <label for="pin" class="form-label fw-bold">PIN</label>
                        <input type="password" id="pin" th:field="*{pin}" class="form-control"
                            required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6"
                            autocomplete="new-password">
                        <div class="form-text">6 digits. Choose something you'll remember.</div>
                    </div>

                    <div class="mb-3">
                        <label for="pinConfirm" class="form-label fw-bold">Confirm PIN</label>
                        <input type="password" id="pinConfirm" th:field="*{pinConfirm}"
                            class="form-control" required inputmode="numeric" pattern="[0-9]{6}"
                            maxlength="6" minlength="6" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-dark fw-bold w-100 mb-3">Send request</button>
                </form>

                <div class="small text-center">
                    Already approved?
                    <a th:href="@{/tool/keep-business-receipt/sign-in}">Sign in</a>
                </div>

            </div>
        </section>

    </main>

</body>

</html>
