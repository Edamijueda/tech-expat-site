<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<div th:fragment="serviceBtn(label, description, href)" class="col d-flex">
    <a th:href="${href}"
       class="service-btn btn border border-2 border-dark rounded-0
              d-flex align-items-center justify-content-center
              position-relative w-100 text-decoration-none text-dark"
       th:aria-label="${label + ': ' + description}">

        <span class="service-btn__label fw-bold fs-5 text-center px-3"
              th:text="${label}">Label</span>

        <div class="service-btn__desc
                    position-absolute top-0 start-0 w-100 h-100
                    d-flex align-items-center justify-content-center
                    p-3 bg-dark text-white text-center"
             aria-hidden="true">
            <span class="fw-bold small" th:text="${description}">Description</span>
        </div>

    </a>
</div>

</body>
</html>
